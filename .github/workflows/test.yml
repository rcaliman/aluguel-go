name: Testes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: aluguel_test
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: node --test tests/*.test.mjs
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go test -race -tags=integration -count=1 ./internal/app
        env:
          ALUGUEL_TEST_DSN: root:integration-only@tcp(127.0.0.1:13306)/aluguel_test?parseTime=true
      - run: go build ./cmd/aluguel
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
