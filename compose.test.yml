# Banco descartável e exclusivo dos testes. Não usa credenciais de produção.
services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: integration-only
      MYSQL_DATABASE: aluguel_test
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:13306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pintegration-only"]
      interval: 2s
      timeout: 2s
      retries: 60
